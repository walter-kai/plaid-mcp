# Build and deploy plaid-mcp to Cloud Run (us-central1, project-11368 / waltyao).
# Two services from one image:
#   spearfresh-link — public Plaid callbacks
#   plaid-api       — private REST for waltyao-mcp / spearfresh callers
#
# Prerequisites in project-11368:
#   Secrets: plaid-client-id, plaid-secret, plaid-token-encryption-key
#   Optional: plaid-service-key
#   GCS path: $_PLAID_ITEMS_GCS_URI (runtime SA needs objectAdmin on bucket)

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: project-11368
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _LINK_SERVICE: spearfresh-link
  _API_SERVICE: plaid-api
  _PLAID_ITEMS_GCS_URI: gs://run-sources-project-11368-us-central1/plaid-mcp/items.json
  _SPEARFRESH_INVOKER_SA: firebase-adminsdk-fbsvc@project-11368.iam.gserviceaccount.com
  _TRIGGER_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/plaid-mcp/plaid-mcp:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/plaid-mcp/plaid-mcp:latest
      - .
      - -f
      - Dockerfile

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/plaid-mcp/plaid-mcp

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - deploy/cloudbuild-deploy.sh
    env:
      - AR_HOSTNAME=$_AR_HOSTNAME
      - AR_PROJECT_ID=$_AR_PROJECT_ID
      - AR_REPOSITORY=$_AR_REPOSITORY
      - COMMIT_SHA=$COMMIT_SHA
      - BUILD_ID=$BUILD_ID
      - DEPLOY_REGION=$_DEPLOY_REGION
      - LINK_SERVICE=$_LINK_SERVICE
      - API_SERVICE=$_API_SERVICE
      - PLAID_ITEMS_GCS_URI=$_PLAID_ITEMS_GCS_URI
      - SPEARFRESH_INVOKER_SA=$_SPEARFRESH_INVOKER_SA
      - TRIGGER_ID=$_TRIGGER_ID

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/plaid-mcp/plaid-mcp:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/plaid-mcp/plaid-mcp:latest

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - plaid-mcp
